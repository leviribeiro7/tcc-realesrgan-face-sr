[project]
name = "realesrgan"
version = "0.1.0"
description = ""
authors = [
    {name = "Cristiano Lima Oliveira",email = "cristianolo@dcomp.ufs.br"}
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.9"
numpy = "^2.1"
torch = "^2.6"
torchvision = "^0.21"
opencv-python = "^4.11"
scikit-learn = "^1.6.1"
tqdm = "^4.67"
scikit-image = "^0.25"
ultralytics = "^8.3"
torch-summary = "^1.4"
albumentations = "^2.0"
pillow = "^11.1"

[tool.poetry.group.dev.dependencies]
taskipy = "^1.14"
ruff = "^0.7"

[tool.taskipy.tasks]
format = 'ruff check . --fix ; ruff format .'
lint = 'ruff check . ; ruff check . --diff'

[tool.ruff]
extend-exclude = ['.poetry', '.ruff_cache', 'dataset']
line-length = 79

[tool.ruff.lint]
ignore = ['PLR0913', 'PLR0917']
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
preview = true

[tool.ruff.format]
quote-style = 'single'
preview = true

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
